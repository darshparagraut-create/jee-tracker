const _s=x=>x.split(';'),esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ONE=_s('Thermodynamics;Kinetic Theory of Gases;SHM & Oscillations;Waves & Sound;Gravitation;Atomic Physics;Dual Nature of Radiation & Matter;Nuclei & Radioactivity;Mechanical Properties of Fluids;Chemical Kinetics;Solutions;Electrochemistry;Aldehydes & Ketones;Carboxylic Acids & Derivatives;Amines;Alcohols, Phenols & Ethers;p-Block Elements;d & f Block Elements;Structure of Atom;Redox Reactions;Sequences & Series;Binomial Theorem;Differential Equations;Indefinite Integration;Straight Lines;Circles;Statistics;Parabola;Ellipse;Hyperbola');
const FULL=_s('Kinematics;Laws of Motion & Friction;Work, Energy & Power;Centre of Mass & Collisions;Rotational Motion;Atomic Physics;Dual Nature of Radiation & Matter;Nuclei & Radioactivity;Kinetic Theory of Gases;Thermal Properties of Matter;Thermodynamics;Mechanical Properties of Fluids;SHM & Oscillations;Electrostatics;Gravitation;Capacitance;Current Electricity;Magnetic Effects of Current;Magnetism & Matter;Alternating Current;Electromagnetic Induction;Some Basic Concepts (Mole Concept);Structure of Atom;Solutions;Electrochemistry;Chemical Kinetics;Chemical & Ionic Equilibrium;Redox Reactions;Chemical Thermodynamics;Periodicity of Properties;Chemical Bonding;General Organic Chemistry;Isomerism;Hydrocarbons;Haloalkanes & Haloarenes;Alcohols, Phenols & Ethers;Aldehydes & Ketones;Carboxylic Acids & Derivatives;Amines;Quadratic Equations;Sequences & Series;Trigonometry;Binomial Theorem;Probability;Limits, Continuity & Differentiability;Applications of Derivatives;Indefinite Integration;Mechanical Properties of Solids');
const PART={'Wave Optics':['lecture'],'Coordination Compounds':['lecture'],'Permutation & Combination':['lecture','module'],'Matrices & Determinants':['lecture','module'],'Functions':['lecture','module'],'Definite Integration':['lecture','module'],'Inverse Trigonometry':['lecture','module'],'Sets & Relations':['lecture','module']};
CH.forEach(c=>{c.len=LNG.includes(c.name)?'L':ONE.includes(c.name)?'O':'B';c.k=FULL.includes(c.name);c.h=c.len=='L'&&!c.k&&!(PART[c.name]||[]).includes('lecture')});const CAP=420;
const STG=['lecture','notes','module','practice','test','revision'],LN={L:['Lecture','#e9b872'],O:['One-shot','#5eead4'],B:['Brief','#a5b4fc']};
const chan=c=>c.len=='L'?(c.s=='p'?'ABJ Sir / Mohit Tyagi':/Bonding|Coordination/.test(c.name)?'Manzil (Om Pandey)':c.s=='c'?'Vora JEE Brief Series':'Vora Classes'):'Vora Classes';
const lt=c=>({L:'a full lecture (long, topic by topic)',O:'a 2 to 3 h one-shot',B:'a brief one-shot (about 1 h)'})[c.len]+' by '+chan(c);
const yt=c=>'https://www.youtube.com/results?search_query='+encodeURIComponent(`${chan(c)} ${c.name} ${({L:'full lecture',O:'one shot',B:'short one shot'})[c.len]} JEE Main`);
const pad=n=>String(n).padStart(2,'0'),ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,dd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)},today=()=>ds(new Date());

const lab=(d,o)=>dd(d).toLocaleDateString('en-IN',o||{weekday:'short',day:'numeric',month:'short'});

const ck=ms=>{const s=Math.floor(ms/1e3);return[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(pad).join(':')};
const chn=id=>(CH.find(c=>c.id==id)||{}).name||'';
/* ---- schedule ---- */
function merge(qs){const t=qs.map(q=>q.length),ix=qs.map(()=>0),o=[],N=t.reduce((a,b)=>a+b,0);while(o.length<N){let b=-1,br=9;qs.forEach((q,i)=>{if(ix[i]<t[i]){const r=ix[i]/t[i];if(r<br){br=r;b=i}}});o.push(qs[b][ix[b]++])}return o}
const PL={};days(START,END).forEach(d=>PL[d]={type:dd(d).getDay()==0?'mock':'rev',sl:[]});
[[1,START,P1END],[2,P2START,END]].forEach(([ph,a,b])=>{
 const qs=['p','c','m'].map(sb=>{const o=[];CH.filter(c=>c.s==sb&&c.ph==ph).sort((u,v)=>u.k-v.k).forEach(c=>{const n=c.h?2:1;for(let i=1;i<=n;i++){const x={c,part:i,of:n};x.min=T(x).reduce((q,t)=>q+t.m,0);o.push(x)}});return o});
 const dl=days(a,b).filter(d=>PL[d].type!='mock'),rest=merge(qs);let prev='';

  let q;while(rest.length&&(q=pick())>=0){const x=rest.splice(q,1)[0];PL[d].type='study';PL[d].sl.push(x);x.c.date=d;if(x.part==1)x.c.pd=d;load+=x.min}prev=d})});

 const rec=()=>A('a',`Recap ${n}: skim your notes and formula sheet; use one short lecture only for a topic that feels shaky`,30,['lecture','notes']);
 const pyq=(q,m)=>A('b',`PYQs: ${q} JEE Main questions on ${n}, timed (about 2.5 min each). Target 70%+`,m,['practice']);

 if(c.k){rec();pyq(30,75);tst(15,35);log(20)}

 else if(part==1){A('a',`Learn ${n} (day 1 of 2): ${lt(c)}, writing notes as you watch`,LM,['lecture']);A('e','Condense your notes to 1 page from memory, then check them against the lecture',25,['notes'])}
 else{A('f','Module (day 2 of 2): solved examples + Exercise I (about 30 questions)',MM,['module']);pyq(25,75);tst(20,45);log(25)}

const MOCK=d=>[['m1','Full-length JEE Main mock under strict 3 h exam conditions',180],['m2','Analyse it: tag every wrong or skipped question as concept gap, silly error, time or guess',90],['m3','Redo all wrong questions, then 15 PYQs on your weakest chapter from this mock',90],['m4','Revise notes of the 3 chapters you were weakest in this week',60],['m5','Log scores below and write next week\'s top 3 fixes',10]].map(([k,t,m])=>({id:d+'.'+k,t,m,st:[],g:'Mock test day'}));

 return`<div class=card><h2>${ed?'Edit test':'Add a test'}</h2><div class=fm style="margin-top:10px"><label>Date<input id=fd type=date value="${e.d}"></label><label>Name<input id=fn value="${v(e.name)}" placeholder="e.g. Aakash FT-3"></label><label>Type<select id=ft>${['JEE Main full','JEE Advanced full','Part test','Chapter test','School / other'].map(x=>`<option${e.type==x?' selected':''}>${x}</option>`).join('')}</select></label>${N('Physics','fp')}${N('Chemistry','fc')}${N('Maths','fm')}${N('Max marks','fx')}${N('Correct','fo')}${N('Wrong','fw')}${N('Skipped','fk')}${N('Silly errors','fs')}${N('Concept gaps','fg')}${N('Minutes taken','fh')}</div><div class=fm style="margin-top:8px"><label style="grid-column:1/-1">Notes / weak chapters<input id=fz value="${v(e.nt)}"></label></div><div class=row style="justify-content:flex-start;margin-top:10px"><button class=pr onclick="tsv()">${ed?'Update test':'Save test'}</button>${ed?'<button class=b onclick="ed=null;render()">Cancel</button>':''}</div></div>
<div class=card><div class=row><h2>Score trend</h2><span class=mu>${T.length} tests · best ${best.toFixed(0)}% · last 3 avg ${avg.toFixed(0)}%</span></div>${svg}</div>
<div class=card style="overflow-x:auto"><h2>All tests</h2>${T.length?`<table><tr><th>Date</th><th>Test</th><th>P</th><th>C</th><th>M</th><th>Total</th><th>✓ / ✗ / skip</th><th>Silly / concept</th><th>Min</th><th></th></tr>${T.map(t=>`<tr><td>${lab(t.d)}</td><td>${esc(t.name)}<br><small class=mu>${esc(t.type)}${t.nt?' · '+esc(t.nt):''}</small></td><td>${t.p??'-'}</td><td>${t.c??'-'}</td><td>${t.m??'-'}</td><td><b>${tot(t)}</b>/${t.max} <small class=mu>${pc(t).toFixed(0)}%</small></td><td>${t.ok??'-'} / ${t.wr??'-'} / ${t.sk??'-'}</td><td>${t.si??'-'} / ${t.cn??'-'}</td><td>${t.tm??'-'}</td><td><button class=b onclick="edT(${t.id})">Edit</button> <button class=x onclick="delT(${t.id})">✕</button></td></tr>`).join('')}</table>`:'<p class=mu>No tests logged yet.</p>'}</div>`}
function render(){const t=S.tm;$('#pin').textContent=t.run?'Punch out':t.ms?'Punch in (resume)':'Punch in';$('#pin').className='pr'+(t.run?' on':'');$('#tm').classList.toggle('run',!!t.run);tick();const a=$('#app'),dn=CH.filter(isDone).length;$('#gp').title=dn+' of '+CH.length+' chapters done';$('#gp i').style.width=dn/CH.length*100+'%';a.className=anim?'in':'';anim=0;a.innerHTML=bn()+({dash,cal,trk,tst,dat})[tab]();document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b.dataset.t==tab))}
function tick(){const t=S.tm;$('#tm').textContent=ck(t.ms+(t.run?Date.now()-t.at:0));$('#tt').textContent='Today '+f(dayMs(today()))}
$('#tch').innerHTML='<option value="">Studying: (any)</option>'+['p','c','m'].map(s=>`<optgroup label="${SUB[s][0]}">${CH.filter(c=>c.s==s).map(c=>`<option value="${c.id}" ${S.tm.ch==c.id?'selected':''}>T${c.tier} · ${c.name}</option>`).join('')}</optgroup>`).join('');
setInterval(tick,1000);anim=1;render();
</script></body></html>
